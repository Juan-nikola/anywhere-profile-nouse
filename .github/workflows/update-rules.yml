name: Update rules

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update:rules
      - run: npm run verify
      - name: Commit verified changes
        run: |
          if git diff --quiet -- rules reports/compatibility.json; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules reports/compatibility.json
          git commit -m "chore: update Anywhere rules"
          git push
